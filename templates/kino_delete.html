{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить фильм</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Удалить фильм</h1>
        <nav><a href="{% url 'kino_list' %}">Назад к фильмам</a></nav>
    </header>
    <div class="b1">
        <form method="post" class="b2">
            {% csrf_token %}
            <p>Вы уверены, что хотите удалить фильм «{{ kino.name }}»?</p>
            <button type="submit">Удалить</button>
            <a class="c1 c3" href="{% url 'kino_list' %}">Отмена</a>
        </form>
    </div>
</body>
</html>
